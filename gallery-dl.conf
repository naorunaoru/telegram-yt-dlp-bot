{
    "#": "gallery-dl configuration for telegram-yt-dlp-bot",

    "extractor": {
        "#": "Use yt-dlp for URLs gallery-dl doesn't support",
        "ytdl": {
            "enabled": true,
            "module": "yt_dlp"
        },

        "#": "Let yt-dlp handle videos on supported platforms",
        "twitter": {
            "videos": "ytdl"
        },
        "instagram": {
            "videos": "ytdl"
        },
        "reddit": {
            "videos": "ytdl"
        },

        "#": "Output settings",
        "base-directory": "./temp/",
        "directory": ["{category}"],
        "filename": "{id}_{num}.{extension}",

        "#": "Skip files that already exist",
        "skip": true
    },

    "downloader": {
        "#": "yt-dlp settings when gallery-dl delegates to it",
        "#": "Match patterns.ts: H.264/H.265/AVC/HEVC codec, <30MB for Telegram",
        "ytdl": {
            "module": "yt_dlp",
            "format": "(bv*[vcodec~='^((he|a)vc|h26[45])'][filesize<30M]+ba) / (bv*[filesize<30M]+ba/b)",
            "merge-output-format": "mp4"
        }
    },

    "output": {
        "#": "Pipe mode for parsing stdout",
        "mode": "pipe"
    }
}
